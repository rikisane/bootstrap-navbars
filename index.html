<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bootstrap Navbars</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container-fluid px-0 boardroom-section">

    <nav class="navbar navbar-expand-lg bg-gradient">

      <div class="container d-flex justify-content-between align-items-center">

        <!-- Instagram -->
        <ul class="nav justify-content-start">
          <li class="nav-item">
            <a class="navbar-brand" href="#">
              <i class="bi bi-instagram"></i>
            </a>
          </li>
        </ul>

        <!-- Boardroom Logo -->
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <img
              src="boardroomlogo.png"
              alt="The Boardroom Logo"
              class="boardroomlogo"
            >
          </li>
        </ul>

        <!-- Menu Button -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <button class="btn btn-dark">Menu</button>
          </li>
        </ul>

      </div>

    </nav>

  </div>

  <!-- Bootstrap 5 JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

</body>

</html>
