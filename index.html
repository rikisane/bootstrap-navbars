<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bootstrap Navbars</title>

  <!-- bootstrap stuff -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >

  <!-- my css -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- navbar 1 -->
  <div class="container-fluid px-0 boardroom-section">

    <nav class="navbar navbar-expand-lg bg-gradient">

      <div class="container d-flex justify-content-between align-items-center">

        <ul class="nav justify-content-start">
          <li class="nav-item">
            <a class="navbar-brand" href="#">
              <i class="bi bi-instagram"></i>
            </a>
          </li>
        </ul>

        <ul class="nav justify-content-center">
          <li class="nav-item">
            <img
              src="boardroomlogo.png"
              alt="The Boardroom Logo"
              class="boardroomlogo"
            >
          </li>
        </ul>

        <ul class="nav justify-content-end">
          <li class="nav-item">
            <button class="btn btn-dark">Menu</button>
          </li>
        </ul>

      </div>

    </nav>

  </div>


  <!-- navbar 2 -->
  <div class="morningbrew-section">

    <nav class="navbar navbar-expand-lg bg-light">
      <div class="container py-2">

        <div class="mx-auto navbar-nav">
          <img
            src="morningbrewlogo.png"
            alt="Morning Brew Logo"
            class="morningbrewlogo"
          >
        </div>

      </div>
    </nav>

    <div class="navbar navbar-expand-lg bg-light sticky-top">

      <div class="container">

        <div class="mx-auto navbar-nav">

          <div class="nav-item active border-3 border-top border-dark">
            Home
          </div>

          <div class="nav-item border-1 border-top border-dark">
            Order Online
          </div>

          <div class="nav-item border-1 border-top border-dark">
            Menus
          </div>

          <div class="nav-item border-1 border-top border-dark">
            Locations
          </div>

          <div class="nav-item border-1 border-top border-dark">
            About
          </div>

          <div class="nav-item border-1 border-top border-dark">
            Shop
          </div>

          <div class="nav-item border-1 border-top border-dark">
            Contact
          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- navbar 3 -->
  <div class="container-fluid px-0 buzzs-section">

    <nav class="navbar navbar-expand-lg bg-gradient">

      <div class="container py-3 d-flex justify-content-between align-items-center">

        <!-- left side -->
        <ul class="nav justify-content-start align-items-center">

          <li class="nav-item px-2">
            <h4>LUNCH</h4>
          </li>

          <li class="nav-item px-2">
            <h4>DINNER</h4>
          </li>

          <li class="nav-item px-2">
            <h4>DRINKS &amp; PUPU</h4>
          </li>

        </ul>

        <!-- buzzs logo -->
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <img
              src="buzzslogo.png"
              alt="Buzz's Logo"
              class="buzzslogo"
            >
          </li>
        </ul>

        <!-- right side -->
        <ul class="nav justify-content-end align-items-center">

          <li class="nav-item px-2">
            <h4>ABOUT</h4>
          </li>

          <li class="nav-item px-2">
            <h4>LOCATION</h4>
          </li>

          <li class="nav-item px-2">
            <h4>SHOP</h4>
          </li>

          <li class="nav-item px-2">
            <h4>
              <i class="bi bi-cart"></i>
            </h4>
          </li>

        </ul>

      </div>

    </nav>

  </div>


  <!-- bootstrap js -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

</body>

</html>
